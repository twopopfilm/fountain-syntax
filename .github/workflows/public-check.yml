name: public-check

# The repository may go public at any time: block local paths, personal data and secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Local paths, emails and commit identities
        run: scripts/check-public.sh
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose
