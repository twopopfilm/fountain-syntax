name: ci

# Format, lint, test and build the docs on the three platforms the library supports.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Clippy with all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test with all features
        run: cargo test --all-features
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest Rust the crate promises to build on.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the minimum supported toolchain
        # Must match rust-version in Cargo.toml.
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - name: Check
        run: cargo check --locked --all-targets
      - name: Check with all features
        run: cargo check --locked --all-targets --all-features
