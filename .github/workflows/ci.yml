name: ci

# The `rust` job formats, lints, tests and builds the docs on the three platforms the library supports; the `features`
# job lints and tests every combination of the Cargo features; the `msrv` job checks the build on the minimum
# supported Rust.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Clippy with all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test with all features
        run: cargo test --all-features
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Every combination of the four Cargo features, on Linux.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install cargo-hack
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-hack@0.6.46
      - name: Clippy with every feature combination
        run: cargo hack clippy --feature-powerset --exclude-features default --all-targets -- -D warnings
      - name: Test with every feature combination
        run: cargo hack test --feature-powerset --exclude-features default

  # The oldest Rust the crate promises to build on.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the minimum supported toolchain
        # Must match rust-version in Cargo.toml.
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - name: Check
        run: cargo check --locked --all-targets
      - name: Check with all features
        run: cargo check --locked --all-targets --all-features
