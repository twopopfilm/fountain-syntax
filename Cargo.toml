[package]
name = "fountain-syntax"
version = "0.1.0"
edition = "2024"
description = "A lossless, spec-complete parser and writer for Fountain screenplays"
license = "MIT OR Apache-2.0"
repository = "https://github.com/twopopfilm/fountain-syntax"
rust-version = "1.85"
readme = "README.md"
keywords = ["fountain", "screenplay", "screenwriting", "parser", "lossless"]
categories = ["parser-implementations", "text-processing"]
exclude = [".claude/", ".github/", "AGENTS.md", "CLAUDE.md", "scripts/", "docs/agents.local.example.md"]

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
locked-scene-numbers = []
shot = []
serde = ["dep:serde"]
hash = ["dep:sha2", "dep:unicode-normalization"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
