[package]
name = "fountain-syntax"
version = "0.0.0"
edition = "2024"
description = "A lossless, spec-complete parser and writer for Fountain screenplays"
license = "MIT OR Apache-2.0"
repository = "https://github.com/twopopfilm/fountain-syntax"

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
locked-scene-numbers = []
shot = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
